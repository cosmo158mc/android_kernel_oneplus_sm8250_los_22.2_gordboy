name: Build OnePlus 9R Kernel

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build deps
        run: |
          sudo apt update -y
          sudo apt install -y bc bison build-essential ccache flex libncurses-dev \
            libssl-dev libelf-dev python3 python3-pip wget zip unzip

      - name: Download Android NDK r25b
        run: |
          mkdir -p $HOME/ndk
          cd $HOME/ndk
          wget -q https://dl.google.com/android/repository/android-ndk-r25b-linux.zip -O ndk.zip
          unzip -q ndk.zip
          echo "NDK=$HOME/ndk/android-ndk-r25b" >> $GITHUB_ENV
          echo "$HOME/ndk/android-ndk-r25b/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Build kernel with make
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export PATH=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH

          mkdir -p out

          # use the provided defconfig
          make O=out defconfig

          # compile kernel image
          make -j$(nproc) O=out

          # copy kernel image into dist
          mkdir -p dist
          cp out/arch/arm64/boot/Image* dist/ || true
          cp out/arch/arm64/boot/dtbo.img dist/ || true

      - name: Package AnyKernel3 zip
        run: |
          cd $GITHUB_WORKSPACE
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3
          cd AnyKernel3
          rm -f Image* dtbo.img
          KERNEL_IMG=$(find ../dist -type f -name "Image*" | head -n1)
          cp "$KERNEL_IMG" ./Image.gz-dtb || cp "$KERNEL_IMG" ./Image.lz4-dtb || cp "$KERNEL_IMG" ./Image
          if [ -f ../dist/dtbo.img ]; then cp ../dist/dtbo.img ./; fi
          cd ..
          zip -r9 kernel-flashable.zip AnyKernel3 -x "*.git*"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-flashable
          path: |
            kernel-flashable.zip
            dist/**
